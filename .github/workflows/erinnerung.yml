name: Tägliche Erinnerung

# Schickt Sabrina zwei Push-Benachrichtigungen am Tag (deutsche Zeit):
#   10 Uhr – „Heute schon gelernt?“
#   19 Uhr – Lob, wenn an dem Tag gelernt wurde (sonst ein lieber Gruß ohne Druck)
# Je zwei Zeitpläne, weil GitHub in UTC rechnet (Sommer-/Winterzeit).
# Das Skript schickt nur bei den Läufen, die gerade 10 bzw. 19 Uhr in Berlin entsprechen,
# und lässt Läufe aus, die mehr als 90 Minuten zu spät starten (lieber keine Nachricht als eine um 1 Uhr nachts).
#
# Benötigte Secrets (Settings → Secrets and variables → Actions):
#   VAPID_PRIVATE_KEY   – privater Schlüssel (nur einmal einrichten)
#   PUSH_SUBSCRIPTIONS  – der Code aus der App („Code an Tobi schicken“); mehrere Geräte als JSON-Liste [ {...}, {...} ]

on:
  schedule:
    # Bewusst nicht zur vollen Stunde: Dann sind GitHubs Server überlastet und Läufe starten oft Stunden zu spät.
    - cron: '7 8 * * *'    # 10:07 Uhr Sommerzeit
    - cron: '7 9 * * *'    # 10:07 Uhr Winterzeit
    - cron: '7 17 * * *'   # 19:07 Uhr Sommerzeit
    - cron: '7 18 * * *'   # 19:07 Uhr Winterzeit
  workflow_dispatch:
    inputs:
      art:
        description: 'Welche Nachricht?'
        type: choice
        options: [morgen, abend]
        default: morgen
      text:
        description: 'Eigener Text (leer lassen für die normale Nachricht)'
        required: false
        default: ''

jobs:
  erinnerung:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock web-push@3.6.7
      - run: node .github/scripts/erinnerung.mjs
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          SCHEDULE: ${{ github.event.schedule }}
          ART: ${{ github.event.inputs.art }}
          TEXT: ${{ github.event.inputs.text }}

<!DOCTYPE html>
<html lang="de">
<head data-own>
<meta charset="utf-8" data-own>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" data-own>
<meta name="apple-mobile-web-app-capable" content="yes" data-own>
<meta name="mobile-web-app-capable" content="yes" data-own>
<meta name="apple-mobile-web-app-status-bar-style" content="default" data-own>
<meta name="apple-mobile-web-app-title" content="Endspurt" data-own>
<meta name="theme-color" content="#f6f1ea" data-own>
<link rel="apple-touch-icon" href="apple-touch-icon.png" data-own>
<link rel="icon" type="image/png" href="icon-192.png" data-own>
<link rel="manifest" href="manifest.webmanifest" data-own>
<title data-own>Sabrinas Endspurt</title>
<link rel="preconnect" href="https://fonts.googleapis.com" data-own>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap" data-own>
<style data-own>
:root{
  --bg:#f6f1ea; --card:#fffdf9; --ink:#2b2233; --muted:#7a6f80; --line:#e9e0d4;
  --plum:#5b2a6e; --plum-soft:#efe4f2; --coral:#e8735a; --coral-soft:#fbe6df; --sage:#5e8c72; --sage-soft:#e2eee6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
h1,h2,.num{font-family:"Fraunces",Georgia,serif}
h1{font-size:30px;margin:0;line-height:1.1}
h2{font-size:19px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px;box-shadow:0 1px 0 rgba(43,34,51,.03)}
.quote{background:var(--plum);color:#fff;border:none}
.quote p{font-family:"Fraunces",Georgia,serif;font-size:20px;line-height:1.35;margin:0}
.quote small{display:block;margin-top:10px;opacity:.7;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.count{display:flex;align-items:center;gap:18px}
.ring{flex:0 0 auto;position:relative;width:128px;height:128px}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct b{font-family:"Fraunces",serif;font-size:28px}
.ring .pct span{font-size:11px;color:var(--muted)}
.big{font-size:44px;line-height:1;font-weight:700}
.stats{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pill{background:var(--plum-soft);color:var(--plum);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500}
.timer{text-align:center}
.timer .num{font-size:58px;letter-spacing:.02em;margin:6px 0 12px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;padding:10px 16px;font-weight:500;transition:transform .08s}
button:active{transform:scale(.97)}
.btn{background:var(--coral);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.seg{background:var(--bg);color:var(--muted)}
.seg.on{background:var(--ink);color:#fff}
.small{padding:7px 12px;font-size:13px}
.today{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);color:var(--muted);font-size:14px}
.today b{color:var(--ink)}
.bars{display:flex;align-items:flex-end;gap:8px;height:90px;margin:8px 0 4px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--sage);min-height:4px}
.bar i.zero{background:var(--line)}
.bar span{font-size:11px;color:var(--muted)}
.bar.is-today span{color:var(--ink);font-weight:700}
.streak{display:flex;gap:10px}
.streak div{flex:1;background:var(--sage-soft);border-radius:14px;padding:10px 12px}
.streak b{font-family:"Fraunces",serif;font-size:24px;display:block}
.streak span{font-size:12px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:none}
.check{width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:2px solid var(--plum);background:transparent;padding:0;display:flex;align-items:center;justify-content:center;color:#fff}
.check.on{background:var(--plum)}
.list .txt{flex:1;font-size:15px}
.list .done .txt{text-decoration:line-through;color:var(--muted)}
.x{background:none;color:var(--muted);padding:4px 8px;font-size:18px}
.add{display:flex;gap:8px;margin-top:10px}
input[type=text],input[type=date],textarea{font:inherit;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;width:100%;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.reward{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.reward:last-child{border-bottom:none}
.reward .ico{font-size:26px;width:40px;height:40px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:0 0 40px}
.reward.locked .ico{filter:grayscale(1);opacity:.5}
.reward .meta{flex:1}
.reward .meta b{font-size:15px;font-weight:500;display:block}
.prog{height:6px;background:var(--line);border-radius:6px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--coral);border-radius:6px}
.tag{font-size:12px;color:var(--muted)}
.unl{background:var(--coral-soft);color:#b5462e}
.claimed{background:var(--sage-soft);color:var(--sage)}
.note{background:var(--coral-soft);border-color:#f3d2c7}
.note p{white-space:pre-wrap;margin:0;font-size:16px;line-height:1.5}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
.set{display:grid;gap:10px;margin-top:12px}
.set label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;transition:transform .3s;z-index:9;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.ro{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
</style>
</head>
<body data-own>
<div id="app" class="wrap" data-own></div>
<div id="toast" class="toast" data-own></div>
<script id="app-state" type="application/json" data-own>{"rev":100,"start":"2024-10-01","end":"2027-08-31","exam":"","examName":"","log":{},"claimed":[],"note":"Ich bin so stolz auf dich, wie du Studium, Familie und Alltag unter einen Hut bekommst.\nBis August 2027 – und dann feiern wir! ❤️\nTobi","milestones":[{"id":"k1","text":"Erste Klausur ausgesucht & angemeldet","done":false},{"id":"k2","text":"Lernplan für die erste Klausur steht","done":false},{"id":"k3","text":"Eine Probe- oder Altklausur unter echten Bedingungen gemacht","done":false},{"id":"k4","text":"Erste Klausur geschrieben 💪","done":false},{"id":"m2","text":"Thema für die Abschlussarbeit festlegen","done":false},{"id":"m3","text":"Betreuung gefunden & Arbeit angemeldet","done":false},{"id":"m4","text":"Gliederung / Exposé fertig","done":false},{"id":"m5","text":"Rohfassung geschrieben","done":false},{"id":"m6","text":"Abschlussarbeit abgegeben","done":false},{"id":"m7","text":"Letzte Prüfung / Kolloquium","done":false},{"id":"m8","text":"Abschluss feiern 🎉","done":false}]}</script>
<script id="app-main" data-own>
(function(){
// Pristine copy of the page, used to save state as a new version
const TPL=(()=>{const c=document.documentElement.cloneNode(true);
  ['head','body'].forEach(t=>{const p=c.querySelector(t);if(!p)return;[...p.children].forEach(n=>{if(!n.hasAttribute('data-own'))n.remove();});});
  c.querySelector('#app').innerHTML='';return c;})();

const $=s=>document.querySelector(s);
const LS='sabrina-endspurt-v1';
let state=JSON.parse($('#app-state').textContent);
try{const l=JSON.parse(localStorage.getItem(LS));if(l&&(l.rev||0)>(state.rev||0))state=l;}catch(e){}

const QUOTES=[
 "Jede Seite, die du heute liest, ist eine Seite weniger bis zum Abschluss.",
 "Du musst nicht perfekt sein. Du musst nur dranbleiben.",
 "Medienkompetenz beginnt bei dir – und bald bringst du sie anderen bei.",
 "Kleine Schritte zählen. Vor allem die an müden Tagen.",
 "Heute 25 Minuten. Morgen wieder. So entstehen Abschlüsse.",
 "Du hast schon so viel geschafft – der Rest ist Endspurt.",
 "Pausen sind Teil des Plans, nicht das Gegenteil davon.",
 "Irgendwann blickst du auf diese Zeit zurück und bist stolz auf dich.",
 "Wer Familie, Alltag und Studium jongliert, schafft auch die nächste Hausarbeit.",
 "Fertig ist besser als perfekt.",
 "Ein Kapitel nach dem anderen – wie bei einem guten Thriller.",
 "Der beste Zeitpunkt anzufangen ist jetzt. Der zweitbeste: nach dem Kaffee.",
 "Du lernst nicht nur für eine Note, sondern für deinen Beruf.",
 "Auch ein zäher Lerntag ist ein Lerntag.",
 "Schokolade ist erlaubt. Aufgeben nicht.",
 "Du bist heute näher am Ziel als gestern.",
 "Konzentrier dich auf die nächste Aufgabe, nicht auf den ganzen Berg.",
 "Der Plot-Twist dieser Geschichte: Du ziehst es durch.",
 "Nicht jeder Tag muss produktiv sein. Aber jeder Tag zählt.",
 "Die erste Klausur ist die schwerste – weil sie neu ist, nicht weil sie schwer ist.",
 "Aufregung vor der Prüfung heißt: Es ist dir wichtig. Nicht: Du kannst es nicht.",
 "Nach der ersten Klausur weißt du, wie es läuft. Ab dann ist es Routine.",
 "Du musst nicht alles wissen. Du musst zeigen, was du weißt.",
 "Fernstudium heißt allein lernen – aber nicht allein sein. Frag nach, tausch dich aus.",
 "Eine Note ist eine Momentaufnahme, kein Urteil über dich."
];
const EXAM_TIPS=[
 "Alt- und Probeklausuren deiner Hochschule nutzen – die zeigen, wie gefragt wird.",
 "Einmal zu Hause unter echten Bedingungen üben: Zeit stoppen, Handy weg, nur erlaubte Hilfsmittel.",
 "Den Ablauf vorher klären: Prüfungszentrum oder Online-Klausur? Anfahrt, Ausweis, Technik-Check.",
 "Lerngruppe, Forum oder Studienberatung anschreiben – andere haben genau die gleichen Fragen.",
 "Mit einem Modul anfangen, das dir liegt. Ein gutes erstes Erlebnis trägt durch die nächsten.",
 "Die erste Klausur ist auch eine Generalprobe. Danach weißt du, wie es läuft."
];
const DEFAULT_REWARDS=[
 {id:"q0",ms:"k4",ico:"🥂",t:"Erste Klausur geschrieben – egal mit welcher Note: Tobi kocht dein Lieblingsessen und wir stoßen an"},
 {id:"p1",h:5,ico:"☕",t:"Lernpausen-Lieferdienst: Einen Lerntag lang bringt Tobi Kaffee & Nervennahrung an deinen Platz"},
 {id:"q2",h:15,ico:"🧹",t:"Eine Woche keine Küche – Tobi spült, räumt und kocht"},
 {id:"p3",h:30,ico:"🎟️",t:"Konzert, Kino oder Event deiner Wahl – die Tickets gehen auf Tobi"},
 {id:"p4",h:50,ico:"🎧",t:"Upgrade für deinen Lernplatz – du suchst aus, Tobi zahlt"},
 {id:"q5",h:65,ico:"🃏",t:"Joker: ein Wunsch frei, Tobi sagt Ja"},
 {id:"q6",h:80,ico:"🚗",t:"Tagesausflug zu zweit – Ziel bestimmst du"},
 {id:"q7",h:null,ico:"🎓",t:"Zum Abschluss: Kurzurlaub zu zweit"}
];
if(!Array.isArray(state.rewards)||state.rewardsV!==2){state.rewards=DEFAULT_REWARDS.map(r=>({...r}));state.rewardsV=2;}
let editingRewards=false;

const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const DAY=864e5;
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=d=>d.toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'});

// ---- saving ----
let art=null,readOnly=false,dirty=false,pubTimer=null;
function connect(){if(window.claude&&window.claude.use){window.claude.use('artifact').then(a=>{art=a;if(dirty)schedule();}).catch(()=>{});return true;}return false;}
if(!connect())window.addEventListener('load',connect,{once:true});
function save(){state.rev=(state.rev||0)+1;try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}dirty=true;schedule();}
function schedule(){if(!art||readOnly)return;clearTimeout(pubTimer);pubTimer=setTimeout(doPublish,1500);}
function doPublish(){
  if(timer.running){pubTimer=setTimeout(doPublish,5000);return;}
  const a=document.activeElement;if(a&&a.matches&&a.matches('textarea,input[type=text]')){pubTimer=setTimeout(doPublish,3000);return;}
  const c=TPL.cloneNode(true);
  c.querySelector('#app-state').textContent=JSON.stringify(state).replace(/</g,'\\u003c');
  dirty=false;
  art.publish('<!DOCTYPE html>\n'+c.outerHTML).catch(e=>{const m=String(e&&(e.code||e.message)||e);if(/not_granted|not_writer/.test(m)){readOnly=true;render();}});
}

// ---- stats ----
function minutes(k){return state.log[k]||0;}
function totalHours(){return Object.values(state.log).reduce((a,b)=>a+b,0)/60;}
function streak(){let d=today0();if(!minutes(key(d)))d=new Date(d-DAY);let n=0;while(minutes(key(d))>0){n++;d=new Date(d-DAY);}return n;}
function addMin(m){const k=key(today0());state.log[k]=Math.max(0,minutes(k)+m);if(!state.log[k])delete state.log[k];save();render();}

// ---- timer ----
const timer={dur:25,remaining:25*60,running:false,end:0};
function fmtT(s){s=Math.max(0,Math.ceil(s));return pad(Math.floor(s/60))+':'+pad(s%60);}
function updateTimer(){const el=$('#tdisp');if(!el)return;const rem=timer.running?(timer.end-Date.now())/1000:timer.remaining;el.textContent=fmtT(rem);}
setInterval(()=>{if(!timer.running)return;if(timer.end-Date.now()<=0){timer.running=false;timer.remaining=timer.dur*60;toast('Geschafft! '+timer.dur+' Minuten eingetragen 💪');try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}addMin(timer.dur);}else updateTimer();},500);

let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),3200);}

let editingNote=false;
function render(){
  const t=today0(),start=parse(state.start),end=parse(state.end);
  const left=Math.max(0,Math.ceil((end-t)/DAY));
  const pct=Math.min(100,Math.max(0,(t-start)/(end-start)*100));
  const C=2*Math.PI*54,off=C*(1-pct/100);
  const doy=Math.floor((t-new Date(t.getFullYear(),0,0))/DAY);
  const quote=QUOTES[doy%QUOTES.length];
  const hours=totalHours(),st=streak(),todayMin=minutes(key(t));
  const allDone=state.milestones.length&&state.milestones.every(m=>m.done);
  const doneCount=state.milestones.filter(m=>m.done).length;
  const wd=['So','Mo','Di','Mi','Do','Fr','Sa'];
  let days=[];for(let i=6;i>=0;i--){const d=new Date(t-i*DAY);days.push({d,m:minutes(key(d))});}
  const maxM=Math.max(60,...days.map(x=>x.m));
  const greet=new Date().getHours()<11?'Guten Morgen':new Date().getHours()<18?'Hey':'Guten Abend';

  $('#app').innerHTML=`
  <h1>${greet}, Sabrina ✨</h1>
  <div class="sub">${t.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})} · Medienpädagogik</div>

  <div class="card quote"><p>„${esc(quote)}“</p><small>Gedanke des Tages</small></div>

  <div class="card"><div class="count">
    <div class="ring"><svg width="128" height="128"><circle cx="64" cy="64" r="54" fill="none" stroke="#efe4f2" stroke-width="12"/><circle cx="64" cy="64" r="54" fill="none" stroke="#5b2a6e" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"/></svg>
      <div class="pct"><b>${Math.round(pct)}%</b><span>geschafft</span></div></div>
    <div><div class="tag">Noch bis zum Abschluss</div><div class="big num">${left}</div><div class="tag">Tage · Ziel ${fmtDate(end)}</div>
      <div class="stats"><span class="pill">${Math.ceil(left/7)} Wochen</span><span class="pill">≈ ${Math.max(0,Math.round(left/30.44))} Monate</span></div></div>
  </div></div>

  <div class="card exam"><h2>📝 Erste Klausur</h2>
    ${(()=>{if(!state.exam)return `<p class="tag" style="font-size:14px;margin:0 0 10px">Trag den Termin deiner ersten Klausur ein – dann wird aus dem großen Fragezeichen ein Plan.</p>
      <div class="set" style="margin-top:0"><label>Modul / Fach<input type="text" id="ename" placeholder="z. B. Grundlagen der Medienpädagogik" value="${esc(state.examName)}"></label><label>Datum<input type="date" id="edate"></label></div>`;
      const ed=parse(state.exam),n=Math.ceil((ed-t)/DAY);
      const head=n>0?`<div class="big num">${n}</div><div class="tag">${n===1?'Tag':'Tage'} bis ${state.examName?esc(state.examName):'zur Klausur'} · ${fmtDate(ed)}</div>`
        :n===0?`<div class="big num">Heute!</div><div class="tag">Du bist vorbereitet. Atmen, lesen, schreiben. Du schaffst das. ❤️</div>`
        :`<div class="big num">✓</div><div class="tag">${state.examName?esc(state.examName):'Klausur'} am ${fmtDate(ed)} – vorbei! Hak sie unten ab und trag die nächste ein.</div>`;
      return head+`<div class="row" style="justify-content:flex-start;margin-top:10px"><button class="btn-ghost small" data-act="examclear">Anderen Termin eintragen</button></div>`;})()}
    <details style="margin-top:14px"><summary>Mutmacher für die erste Klausur im Fernstudium</summary>
      <ul class="list" style="margin-top:6px">${EXAM_TIPS.map(x=>`<li><span class="txt" style="font-size:14px">${esc(x)}</span></li>`).join('')}</ul></details>
  </div>

  <div class="card timer"><h2>⏱️ Fokus-Timer</h2>
    <div class="row">${[25,45].map(m=>`<button class="seg small ${timer.dur===m?'on':''}" data-act="dur" data-v="${m}">${m} Min</button>`).join('')}</div>
    <div class="num" id="tdisp">${fmtT(timer.remaining)}</div>
    <div class="row">${timer.running?`<button class="btn" data-act="pause">Pause</button>`:`<button class="btn" data-act="start">${timer.remaining<timer.dur*60?'Weiter':'Los geht’s'}</button>`}<button class="btn-ghost" data-act="reset">Zurücksetzen</button></div>
    <div class="today">Heute gelernt: <b>${todayMin} Min</b><div class="row" style="margin-top:8px">
      <button class="btn-ghost small" data-act="add" data-v="15">+15</button><button class="btn-ghost small" data-act="add" data-v="30">+30</button><button class="btn-ghost small" data-act="add" data-v="60">+60</button><button class="btn-ghost small" data-act="add" data-v="-15">−15</button></div></div>
  </div>

  <div class="card"><h2>🌱 Deine Woche</h2>
    <div class="streak"><div><b>${st}</b><span>${st===1?'Tag':'Tage'} am Stück</span></div><div><b>${hours.toFixed(1).replace('.',',')}</b><span>Stunden gesamt</span></div><div><b>${doneCount}/${state.milestones.length}</b><span>Meilensteine</span></div></div>
    <div class="bars">${days.map((x,i)=>`<div class="bar ${i===6?'is-today':''}"><i class="${x.m?'':'zero'}" style="height:${x.m?Math.max(6,x.m/maxM*70):4}px"></i><span>${wd[x.d.getDay()]}</span></div>`).join('')}</div>
  </div>

  <div class="card"><h2 style="justify-content:space-between"><span>🎁 Belohnungen</span><button class="btn-ghost small" data-act="${editingRewards?'rewsave':'rewedit'}">${editingRewards?'Fertig':'Bearbeiten'}</button></h2>
    ${editingRewards?state.rewards.map(r=>`<div class="reward"><div class="ico">${r.ico}</div><div class="meta" style="display:grid;gap:6px">
      <input type="text" data-rt="${r.id}" value="${esc(r.t)}">
      ${r.ms?'<span class="tag">wird freigeschaltet mit dem Meilenstein „Erste Klausur geschrieben“</span>':r.h==null?'<span class="tag">wird freigeschaltet, wenn alle Meilensteine abgehakt sind</span>':`<label class="tag" style="display:flex;gap:8px;align-items:center">ab <input type="number" min="1" data-rh="${r.id}" value="${r.h}" style="width:80px;font:inherit;border:1px solid var(--line);border-radius:10px;padding:6px 8px"> Stunden</label>`}
      </div></div>`).join(''):state.rewards.map(r=>{const msObj=r.ms&&state.milestones.find(m=>m.id===r.ms);if(r.ms&&!msObj)return '';
      const unl=r.ms?msObj.done:r.h==null?allDone:hours>=r.h;const cl=state.claimed.includes(r.id);const p=r.ms?0:r.h==null?(state.milestones.length?doneCount/state.milestones.length:0):Math.min(1,hours/r.h);
      return `<div class="reward ${unl?'':'locked'}"><div class="ico">${r.ico}</div><div class="meta"><b>${esc(r.t)}</b>
      ${unl?'':`${r.ms?'':`<div class="prog"><i style="width:${p*100}%"></i></div>`}<span class="tag">${r.ms?'Meilenstein „'+esc(msObj.text)+'“ abhaken':r.h==null?'alle Meilensteine abhaken':`ab ${r.h} Std · noch ${Math.max(0,r.h-hours).toFixed(1).replace('.',',')} Std`}</span>`}</div>
      ${unl?`<button class="small ${cl?'claimed':'unl'}" data-act="claim" data-id="${r.id}">${cl?'✓ eingelöst':'Einlösen'}</button>`:''}</div>`;}).join('')}
  </div>

  <div class="card"><h2>🗺️ Meilensteine</h2>
    <ul class="list">${state.milestones.map(m=>`<li class="${m.done?'done':''}"><button class="check ${m.done?'on':''}" data-act="ms" data-id="${m.id}" aria-label="abhaken">${m.done?'✓':''}</button><span class="txt">${esc(m.text)}</span><button class="x" data-act="msdel" data-id="${m.id}" aria-label="löschen">×</button></li>`).join('')}</ul>
    <form class="add" id="msform"><input type="text" id="msin" placeholder="Neuer Meilenstein …"><button class="btn small" type="submit">+</button></form>
  </div>

  <div class="card note"><h2>💌 Von Tobi</h2>
    ${editingNote?`<textarea id="notein">${esc(state.note)}</textarea><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn small" data-act="notesave">Speichern</button></div>`
      :`<p>${esc(state.note)}</p><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn-ghost small" data-act="noteedit">Bearbeiten</button></div>`}
  </div>

  <div class="card"><details><summary>Einstellungen</summary><div class="set">
    <label>Studienbeginn<input type="date" id="sstart" value="${state.start}"></label>
    <label>Geplanter Abschluss<input type="date" id="send" value="${state.end}"></label>
  </div></details></div>
  ${readOnly?'<div class="ro">Fortschritt wird nur in diesem Browser gespeichert.</div>':''}`;
  updateTimer();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=+b.dataset.v,id=b.dataset.id;
  if(a==='dur'&&!timer.running){timer.dur=v;timer.remaining=v*60;render();}
  else if(a==='start'){timer.running=true;timer.end=Date.now()+timer.remaining*1000;render();}
  else if(a==='pause'){timer.remaining=(timer.end-Date.now())/1000;timer.running=false;render();}
  else if(a==='reset'){timer.running=false;timer.remaining=timer.dur*60;render();}
  else if(a==='add'){addMin(v);}
  else if(a==='ms'){const m=state.milestones.find(x=>x.id===id);m.done=!m.done;if(m.done)toast('Meilenstein geschafft! 🎉');save();render();}
  else if(a==='msdel'){state.milestones=state.milestones.filter(x=>x.id!==id);save();render();}
  else if(a==='claim'){state.claimed=state.claimed.includes(id)?state.claimed.filter(x=>x!==id):[...state.claimed,id];save();render();}
  else if(a==='rewedit'){editingRewards=true;render();}
  else if(a==='rewsave'){document.querySelectorAll('[data-rt]').forEach(i=>{const r=state.rewards.find(x=>x.id===i.dataset.rt);if(r&&i.value.trim())r.t=i.value.trim();});
    document.querySelectorAll('[data-rh]').forEach(i=>{const r=state.rewards.find(x=>x.id===i.dataset.rh);const v=Math.round(+i.value);if(r&&v>0)r.h=v;});
    state.rewards.sort((a,b)=>(a.ms?-1:b.ms?1:0)||((a.h??1e9)-(b.h??1e9)));editingRewards=false;save();render();}
  else if(a==='examclear'){state.exam='';save();render();}
  else if(a==='noteedit'){editingNote=true;render();$('#notein').focus();}
  else if(a==='notesave'){state.note=$('#notein').value.trim();editingNote=false;save();render();}
});
document.addEventListener('submit',e=>{if(e.target.id!=='msform')return;e.preventDefault();const v=$('#msin').value.trim();if(!v)return;state.milestones.push({id:'m'+Date.now(),text:v,done:false});save();render();});
document.addEventListener('change',e=>{
  if(e.target.id==='sstart'&&e.target.value){state.start=e.target.value;save();render();}
  if(e.target.id==='send'&&e.target.value){state.end=e.target.value;save();render();}
  if(e.target.id==='ename'){state.examName=e.target.value.trim();save();}
  if(e.target.id==='edate'&&e.target.value){const nm=$('#ename');if(nm)state.examName=nm.value.trim();state.exam=e.target.value;save();render();}
});
render();
})();
</script>
</body>
</html>
